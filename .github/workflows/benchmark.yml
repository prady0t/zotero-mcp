name: MTEB Benchmark

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run benchmark daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
        model: [
          "Qwen/Qwen3-Embedding-0.6B",
          "sentence-transformers/all-MiniLM-L6-v2",
          "sentence-transformers/all-mpnet-base-v2"
        ]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache MTEB benchmark data
      uses: actions/cache@v3
      with:
        path: ~/.cache/mteb_benchmark
        key: ${{ runner.os }}-mteb-${{ hashFiles('**/mteb_integration_benchmark.py') }}
        restore-keys: |
          ${{ runner.os }}-mteb-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sentence-transformers torch
    
    - name: Run MTEB benchmark
      timeout-minutes: 30
      run: |
        python mteb_integration_benchmark.py \
          --model "${{ matrix.model }}" \
          --modes abstract \
          --dataset-size 50 \
          --test-queries 25 \
          --query-file benchmarks/queries/semantic_retrieval_queries.json \
          --cache-dir ~/.cache/mteb_benchmark \
          --output-dir benchmarks/results/ci-run
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: benchmark-results-${{ matrix.model }}-${{ matrix.python-version }}
        path: |
          benchmarks/results/ci-run/
          ~/.cache/mteb_benchmark/
        retention-days: 30
    
    - name: Extract and summarize metrics
      if: always()
      run: |
        python benchmarks/extract_metrics.py benchmarks/results/ci-run/ || echo "Metrics extraction failed"
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      env:
        MODEL: ${{ matrix.model }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            // Try to read summary JSON
            const summaryPath = 'benchmarks/results/ci-run/summary.json';
            let results = `## 🚀 MTEB Benchmark Results\n\nModel: ${process.env.MODEL}\n\n`;
            
            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const modelResults = summary.filter(r => r.model.includes(process.env.MODEL.split('/').pop()));
              
              if (modelResults.length > 0) {
                const r = modelResults[0];
                results += `**Abstract Mode:**\n`;
                results += `- P@1: ${r.accuracy.toFixed(3)}\n`;
                results += `- P@5: ${r.precision.toFixed(3)}\n`;
                results += `- MRR: ${r.mrr.toFixed(3)}\n`;
                results += `- NDCG: ${r.ndcg.toFixed(3)}\n`;
                results += `- Embedding Time: ${r.embedding_time.toFixed(1)}s\n`;
              } else {
                results += "✅ Benchmark completed (results processing in progress)";
              }
            } else {
              results += "✅ Benchmark completed";
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: results
            });
          } catch (error) {
            console.log('Error creating comment:', error);
            // Don't fail the workflow if comment creation fails
          }
