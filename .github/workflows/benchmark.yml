name: MTEB Benchmark

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run benchmark daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        model: [
          "Qwen/Qwen3-Embedding-0.6B",
          "sentence-transformers/all-MiniLM-L6-v2",
          "sentence-transformers/all-mpnet-base-v2"
        ]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: false
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache MTEB benchmark data
      uses: actions/cache@v4
      with:
        path: ~/.cache/mteb_benchmark
        key: ${{ runner.os }}-mteb-${{ hashFiles('**/mteb_integration_benchmark.py') }}
        restore-keys: |
          ${{ runner.os }}-mteb-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install chromadb sentence-transformers torch numpy requests
    
    - name: Run MTEB benchmark
      timeout-minutes: 30
      run: |
        python mteb_integration_benchmark.py \
          --model "${{ matrix.model }}" \
          --modes abstract \
          --dataset-size 50 \
          --test-queries 25 \
          --query-file benchmarks/queries/semantic_retrieval_queries.json \
          --cache-dir ~/.cache/mteb_benchmark \
          --output-dir benchmarks/results/ci-run
    
    - name: Prepare artifact name
      if: always()
      run: |
        # Sanitize model name for artifact (replace / with -)
        MODEL_SANITIZED=$(echo "${{ matrix.model }}" | tr '/' '-')
        ARTIFACT_NAME="benchmark-results-${MODEL_SANITIZED}-${{ matrix.python-version }}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          benchmarks/results/ci-run/
          ~/.cache/mteb_benchmark/
        retention-days: 30

  comment:
    needs: benchmark
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
    - name: Aggregate and compare results
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          
          try {
            console.log('Fetching artifacts for run:', context.runId);
            
            // Get all artifacts from this workflow run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            console.log(`Found ${artifacts.data.artifacts.length} total artifacts`);
            
            const benchmarkArtifacts = artifacts.data.artifacts.filter(a => 
              a.name.startsWith('benchmark-results-')
            );
            
            console.log(`Found ${benchmarkArtifacts.length} benchmark artifacts: ${benchmarkArtifacts.map(a => a.name).join(', ')}`);
            
            if (benchmarkArtifacts.length === 0) {
              console.error('❌ No benchmark artifacts found');
              return;
            }
            
            fs.mkdirSync('artifacts', { recursive: true });
            const allResults = [];
            
            // Download and process each artifact
            for (const artifact of benchmarkArtifacts) {
              try {
                console.log(`Processing artifact: ${artifact.name} (ID: ${artifact.id})`);
                
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip'
                });
                
                const zipPath = path.join('artifacts', `${artifact.id}.zip`);
                fs.writeFileSync(zipPath, Buffer.from(download.data));
                console.log(`Downloaded ${artifact.name} to ${zipPath}`);
                
                // Unzip
                const extractDir = path.join('artifacts', artifact.id.toString());
                execSync(`unzip -q -o ${zipPath} -d ${extractDir}`, { stdio: 'pipe' });
                console.log(`Extracted to ${extractDir}`);
                
                // Look for summary.json in various locations
                const summaryPaths = [
                  path.join(extractDir, 'benchmarks', 'results', 'ci-run', 'summary.json'),
                  path.join(extractDir, 'summary.json'),
                  path.join(extractDir, 'benchmarks', 'results', 'summary.json')
                ];
                
                let found = false;
                for (const summaryPath of summaryPaths) {
                  if (fs.existsSync(summaryPath)) {
                    console.log(`Found summary.json at: ${summaryPath}`);
                    const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                    console.log(`Loaded ${summary.length} results from ${summaryPath}`);
                    allResults.push(...summary);
                    found = true;
                    break;
                  }
                }
                
                if (!found) {
                  console.log(`Warning: No summary.json found for ${artifact.name}`);
                  // List files for debugging
                  try {
                    const files = execSync(`find ${extractDir} -type f -name "*.json"`, { encoding: 'utf8' });
                    console.log(`Found JSON files: ${files}`);
                  } catch (e) {
                    console.log(`Could not list files: ${e.message}`);
                  }
                }
              } catch (err) {
                console.log(`Error processing artifact ${artifact.name}: ${err.message}`);
                console.log(err.stack);
              }
            }
            
            console.log(`Total results collected: ${allResults.length}`);
            
            if (allResults.length === 0) {
              console.error('❌ No results found in any artifacts');
              return;
            }
            
            // Group by model (keep only latest Python version per model for comparison)
            const modelGroups = {};
            for (const result of allResults) {
              const modelName = result.model;
              if (!modelGroups[modelName]) {
                modelGroups[modelName] = [];
              }
              modelGroups[modelName].push(result);
            }
            
            // Build comparison table
            let comment = '## 🚀 MTEB Benchmark Results Comparison\n\n';
            comment += '### Abstract Mode Results\n\n';
            comment += '| Model | P@1 | P@5 | R@5 | MRR | NDCG@10 | MAP | Embed Time (s) |\n';
            comment += '|-------|-----|-----|-----|-----|---------|-----|----------------|\n';
            
            // Get best values for highlighting
            const best = {
              accuracy: Math.max(...allResults.map(r => r.accuracy)),
              precision: Math.max(...allResults.map(r => r.precision)),
              mrr: Math.max(...allResults.map(r => r.mrr)),
              ndcg: Math.max(...allResults.map(r => r.ndcg)),
              map_score: Math.max(...allResults.map(r => r.map_score))
            };
            
            // Sort by MAP score (descending)
            const sortedModels = Object.keys(modelGroups).sort((a, b) => {
              const aMap = Math.max(...modelGroups[a].map(r => r.map_score));
              const bMap = Math.max(...modelGroups[b].map(r => r.map_score));
              return bMap - aMap;
            });
            
            for (const modelName of sortedModels) {
              const results = modelGroups[modelName];
              // Use the result with highest MAP for display
              const bestResult = results.reduce((best, curr) => 
                curr.map_score > best.map_score ? curr : best
              );
              
              const fmt = (val, bestVal) => {
                const formatted = val.toFixed(3);
                return Math.abs(val - bestVal) < 0.001 ? `**${formatted}**` : formatted;
              };
              
              comment += `| ${modelName} | ${fmt(bestResult.accuracy, best.accuracy)} | ${fmt(bestResult.precision, best.precision)} | ${bestResult.recall.toFixed(3)} | ${fmt(bestResult.mrr, best.mrr)} | ${fmt(bestResult.ndcg, best.ndcg)} | ${fmt(bestResult.map_score, best.map_score)} | ${bestResult.embedding_time.toFixed(1)} |\n`;
            }
            
            comment += '\n💡 **Bold** values indicate best performance for that metric.\n';
            
            console.log('Generated comment:', comment.substring(0, 200) + '...');
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('🚀 MTEB Benchmark Results')
            );
            
            if (botComment) {
              console.log('Updating existing comment:', botComment.id);
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              console.log('Comment updated successfully');
            } else {
              console.log('Creating new comment');
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log('Comment created successfully');
            }
          } catch (error) {
            console.error('❌ Error creating comment:', error);
            console.error('Error stack:', error.stack);
            throw error; // This will fail the step
          }
